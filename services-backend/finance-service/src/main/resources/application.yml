server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: scalewash-finance-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

management:
  endpoints:
    web:
      exposure:
        include: health,info

scalewash:
  finance:
    zone: ${SCALEWASH_FINANCE_ZONE:Asia/Jakarta}
