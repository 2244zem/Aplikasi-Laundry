services:
  cassandra:
    image: cassandra:5.0
    container_name: ungu-laundry-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: "ungu-laundry-local"
      CASSANDRA_DC: "datacenter1"
      CASSANDRA_ENDPOINT_SNITCH: "GossipingPropertyFileSnitch"
      MAX_HEAP_SIZE: "512M"
      HEAP_NEWSIZE: "128M"
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' 127.0.0.1 9042"]
      interval: 20s
      timeout: 10s
      retries: 10

volumes:
  cassandra-data:
